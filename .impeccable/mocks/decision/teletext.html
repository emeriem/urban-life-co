<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teletext Service</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 42px 6vw; background: #0000c0; color: #fff; font-family: "Courier New", monospace; }
      .page { max-width: 1280px; margin: auto; }
      nav { display: flex; justify-content: space-between; padding: 12px 16px; background: #00c000; color: #000; font-size: 17px; font-weight: 900; }
      .screen { display: grid; grid-template-columns: 1.1fr .9fr; gap: 34px; padding: 42px 18px; }
      .number { color: #ffff00; font-size: 17px; font-weight: 900; letter-spacing: .18em; }
      h1 { margin: 24px 0; color: #ffff00; font-size: clamp(72px, 9vw, 124px); line-height: .84; letter-spacing: -.1em; }
      p { max-width: 490px; font-size: 18px; line-height: 1.55; }
      .action { display: inline-block; margin-top: 16px; padding: 17px 22px; background: #ffff00; color: #0000c0; font-weight: 900; }
      .list { border: 2px solid #fff; }
      .list div { display: flex; justify-content: space-between; gap: 18px; padding: 18px; border-bottom: 2px solid #fff; font-size: 16px; font-weight: 700; }
      .list div:last-child { border-bottom: 0; }
      .list div:nth-child(even) { color: #ffff00; }
      footer { padding: 18px; background: #00c000; color: #000; font-weight: 900; }
      @media (max-width: 760px) { body { padding: 20px; } .screen { grid-template-columns: 1fr; } h1 { font-size: 76px; } }
    </style>
  </head>
  <body>
    <main class="page">
      <nav><span>URBAN LIFE CO.</span><span>LIVE · CONNECT · EXPLORE</span></nav>
      <section class="screen">
        <div><span class="number">P100 / ENUGU</span><h1>FIND YOUR PEOPLE.</h1><p>Browse events, experiences, and stories from the Urban Life community.</p><span class="action">P200 · EVENTS ↗</span></div>
        <div class="list"><div><span>P210 / UPCOMING</span><span>›</span></div><div><span>P220 / EXPERIENCES</span><span>›</span></div><div><span>P230 / COMMUNITY</span><span>›</span></div><div><span>P240 / JOURNAL</span><span>›</span></div></div>
      </section>
      <footer>PRESS P200 TO EXPLORE EVENTS</footer>
    </main>
  </body>
</html>
