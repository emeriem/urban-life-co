<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171a16" />
    <title>You're offline — Urban Life Co.</title>
    <style>
      :root { color-scheme: light; font-family: Inter, Arial, sans-serif; background: #f5f3ef; color: #171a16; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; }
      main { width: min(100%, 560px); padding: clamp(28px, 7vw, 56px); background: #fff; border: 1px solid #e7e2d9; }
      .mark { display: inline-grid; width: 52px; height: 52px; place-items: center; background: #171a16; color: #fff; font-weight: 900; letter-spacing: -.08em; }
      p { color: #5d625a; line-height: 1.7; }
      a { display: inline-block; margin-top: 14px; padding: 13px 18px; background: #171a16; color: #fff; text-decoration: none; font-weight: 700; }
      h1 { margin: 28px 0 12px; font-size: clamp(32px, 7vw, 48px); line-height: 1.05; letter-spacing: -.05em; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">UL</span>
      <h1>You're between connections.</h1>
      <p>Urban Life Co. needs an internet connection to load fresh experiences and event information. Reconnect and try again to continue exploring.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
